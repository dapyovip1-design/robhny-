<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ربحني - منصة المهام والعروض</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            user-select: none;
        }
        .glass {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4">

    <!-- Header -->
    <header class="w-full max-w-md mx-auto flex justify-between items-center py-4">
        <h1 class="text-xl font-bold text-emerald-400">⚡ ربحني</h1>
        <div id="user-info" class="hidden flex items-center gap-3">
            <span id="user-balance" class="bg-emerald-950 text-emerald-400 px-3 py-1 rounded-full text-sm font-semibold">0.00 نقطة</span>
            <button onclick="logout()" class="text-xs bg-red-600 hover:bg-red-700 px-3 py-1 rounded-lg transition">خروج</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-md mx-auto my-auto">
        
        <!-- Auth Section -->
        <div id="auth-section" class="glass p-6 rounded-2xl shadow-xl">
            <h2 class="text-2xl font-bold text-center mb-2">أهلاً بك في ربحني 🚀</h2>
            <p class="text-gray-400 text-center text-sm mb-6">اربح يومياً من المهام والألعاب، أو روّج لحساباتك</p>
            
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">البريد الإلكتروني</label>
                    <input type="email" id="email" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">كلمة المرور</label>
                    <input type="password" id="password" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <button type="submit" id="auth-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-black font-bold py-3 rounded-xl transition shadow-lg shadow-emerald-500/20">تسجيل الدخول</button>
            </form>
            <div class="mt-4 text-center">
                <button onclick="toggleMode()" id="switch-mode-btn" class="text-xs text-emerald-400 hover:underline">ليس لديك حساب؟ إنشاء حساب جديد</button>
            </div>
            <div id="error-msg" class="mt-3 text-center text-xs text-red-400"></div>
        </div>

        <!-- Dashboard / Offerwall Section -->
        <div id="dashboard-section" class="hidden space-y-4">
            <div class="glass p-6 rounded-2xl text-center shadow-xl">
                <h3 class="text-lg font-semibold text-gray-300 mb-1">رصيدك الحالي</h3>
                <h2 id="dashboard-balance" class="text-3xl font-black text-emerald-400 mb-4">0.00</h2>
                <p class="text-xs text-gray-400">أكمل العروض أدناه لتضاف الأرباح إلى رصيدك تلقائياً!</p>
            </div>

            <!-- ayeT-Studios Offerwall Button -->
            <button onclick="openOfferwall()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-black font-bold py-4 rounded-xl transition shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2">
                🎮 العب واربح (حائط عروض ayeT-Studios)
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-gray-600 py-4">
        جميع الحقوق محفوظة &copy; 2026 ربحني
    </footer>

    <!-- Supabase Logic Script -->
    <script>
        const SUPABASE_URL = 'https://yreoztmcjylqlaonuadb.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlyZW96dG1janylcWxhb251YWRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1MjYyNjcsImV4cCI6MjExMTEwMjI2N30.4aOPvo2qZK0_iAs1gdekA_3Lqx6yO1v4C1kSB-djM0Y';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isSignUp = false;
        let currentUser = null;

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                showDashboard();
            }
        });

        function toggleMode() {
            isSignUp = !isSignUp;
            const btn = document.getElementById('auth-btn');
            const switchBtn = document.getElementById('switch-mode-btn');
            if (isSignUp) {
                btn.textContent = 'إنشاء حساب جديد';
                switchBtn.textContent = 'لديك حساب بالفعل؟ تسجيل الدخول';
            } else {
                btn.textContent = 'تسجيل الدخول';
                switchBtn.textContent = 'ليس لديك حساب؟ إنشاء حساب جديد';
            }
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errDiv = document.getElementById('error-msg');
            errDiv.textContent = '';

            try {
                if (isSignUp) {
                    const { data, error } = await supabaseClient.auth.signUp({ email, password });
                    if (error) throw error;
                    alert('تم إنشاء الحساب بنجاح! يمكنك تسجيل الدخول الآن.');
                    isSignUp = false;
                    toggleMode();
                } else {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    currentUser = data.user;
                    showDashboard();
                }
            } catch (err) {
                errDiv.textContent = 'خطأ: ' + err.message;
            }
        }

        async function showDashboard() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('user-info').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            await fetchBalance();
        }

        async function fetchBalance() {
            if (!currentUser) return;
            const { data, error } = await supabaseClient
                .from('profiles')
                .select('balance')
                .eq('id', currentUser.id)
                .single();

            if (data) {
                const bal = data.balance || 0;
                document.getElementById('user-balance').textContent = bal + ' نقطة';
                document.getElementById('dashboard-balance').textContent = bal;
            }
        }

        function openOfferwall() {
            if (!currentUser) return alert('يرجى تسجيل الدخول أولاً');
            const userId = currentUser.id;
            const offerwallUrl = `https://www.ayetstudios.com/offers/web_offerwall/YOUR_PUBLISHER_ID?user_id=${userId}`;
            window.open(offerwallUrl, '_blank');
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }
    </script>
</body>
</html>
